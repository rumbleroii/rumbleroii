[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clibridge"
version = "0.1.0"
description = "Use your Claude Code and Codex subscriptions from OpenAI, Anthropic, LangChain, LiteLLM and other LLM SDKs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40", "httpx>=0.27"]
anthropic = ["anthropic>=0.40", "httpx>=0.27"]
langchain = ["langchain-openai>=0.3", "httpx>=0.27"]
litellm = ["litellm>=1.60"]
all = ["clibridge[openai,anthropic,langchain,litellm]"]
dev = ["clibridge[all]", "pytest>=8", "langgraph", "openai-agents"]

[project.scripts]
clibridge = "clibridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
